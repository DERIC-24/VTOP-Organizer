
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VTOP Organizer</title>

    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>

    <header>
        <div class="brand">
            <div class="brand-icon">V</div>

            <div>
                <h1>VTOP Organizer</h1>
                <p>Course Material Manager</p>
            </div>
        </div>
    </header>

    <main>

        <section class="status-card">
            <span class="label">CONNECTION STATUS</span>

            <h2 id="status-title">
                Checking browser...
            </h2>

            <p id="status-description">
                Detecting the current website.
            </p>
        </section>

        <section class="course-card">
            <span class="label">CURRENT COURSE</span>

            <h2 id="course-name">
                No course detected
            </h2>

            <p id="course-code">
                Waiting for VTOP integration
            </p>
        </section>

        <button id="refresh-button">
            Refresh connection
        </button>

    </main>

    <footer>
        VTOP Organizer · Version 0.1.0
    </footer>

    <script src="sidepanel.js"></script>

</body>
</html>
